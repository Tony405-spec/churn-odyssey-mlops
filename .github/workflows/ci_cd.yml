name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest tests/ --cov=src --cov-report=term
      - name: Lint
        run: |
          flake8 src tests
          mypy src

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t churn-odyssey:latest .
          if [ -n "${{ secrets.ECR_REPOSITORY }}" ]; then
            docker tag churn-odyssey:latest "${{ secrets.ECR_REPOSITORY }}:latest"
            docker push "${{ secrets.ECR_REPOSITORY }}:latest"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to SageMaker or ECS
        run: |
          if [ "${{ vars.DEPLOY_TARGET }}" = "sagemaker" ]; then
            bash scripts/sagemaker_deploy.sh
          else
            echo "ECS deployment hook placeholder"
          fi

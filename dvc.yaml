stages:
  validate:
    cmd: python src/data_validation.py data/raw/fictitious_company_data.csv
    deps:
      - src/data_validation.py
      - data/raw/fictitious_company_data.csv
    outs:
      - data/processed/validated_data.parquet
    metrics:
      - metrics/validation_report.json

  preprocess:
    cmd: python src/preprocess.py data/processed/validated_data.parquet
    deps:
      - src/preprocess.py
      - data/processed/validated_data.parquet
    outs:
      - data/processed/train.parquet
      - data/processed/test.parquet
      - data/processed/val.parquet
    params:
      - preprocess.test_size
      - preprocess.random_state

  feature_engineering:
    cmd: python src/feature_engineering.py --input data/processed/train.parquet
    deps:
      - src/feature_engineering.py
      - data/processed/train.parquet
    outs:
      - data/features/train_features.parquet
      - data/features/test_features.parquet
      - data/features/feature_columns.json
    params:
      - feature_engineering.include_polynomial
      - feature_engineering.target_encode_smoothing

  impute:
    cmd: python src/imputation_strategies.py --best
    deps:
      - src/imputation_strategies.py
      - data/features/train_features.parquet
    outs:
      - data/imputed/train_imputed.parquet
      - data/imputed/test_imputed.parquet
      - reports/imputation_comparison.png
    metrics:
      - metrics/imputation_scores.json

  tune:
    cmd: python src/optuna_optimization.py --trials 200
    deps:
      - src/optuna_optimization.py
      - data/imputed/train_imputed.parquet
    outs:
      - models/optuna_study.pkl
      - reports/optuna_parallel_coord.png
    params:
      - tune.n_trials
      - tune.timeout

  train_attention:
    cmd: python src/pytorch_attention_model.py --epochs 200 --patience 15
    deps:
      - src/pytorch_attention_model.py
      - data/imputed/train_imputed.parquet
    outs:
      - models/attention_best.pt
      - models/attention_checkpoints/
    metrics:
      - metrics/attention_training_log.json
    params:
      - attention.learning_rate
      - attention.batch_size
      - attention.focal_gamma

  ensemble:
    cmd: python src/ensemble_stacking.py
    deps:
      - src/ensemble_stacking.py
      - models/lightgbm_best.pkl
      - models/xgboost_best.pkl
      - models/randomforest_best.pkl
      - models/attention_best.pt
    outs:
      - models/ensemble_meta_model.pkl
      - models/ensemble_weights.json
    metrics:
      - metrics/ensemble_performance.json

  evaluate:
    cmd: python src/evaluate.py --ensemble models/ensemble_meta_model.pkl
    deps:
      - src/evaluate.py
      - data/imputed/test_imputed.parquet
      - models/ensemble_meta_model.pkl
    metrics:
      - metrics/final_test_metrics.json
    plots:
      - reports/roc_curve.png
      - reports/pr_curve.png
      - reports/confusion_matrix.png
      - reports/calibration_curve.png

  explain:
    cmd: python src/shap_explanations.py --model models/ensemble_meta_model.pkl
    deps:
      - src/shap_explanations.py
      - models/ensemble_meta_model.pkl
      - data/imputed/test_imputed.parquet
    outs:
      - reports/shap/waterfall_plots/
      - reports/shap/global_summary.png
      - reports/shap/shap_values.json

  monitor:
    cmd: python src/drift_detection.py --serve
    deps:
      - src/drift_detection.py
      - models/ensemble_meta_model.pkl
    outs:
      - logs/drift_metrics.db
      - reports/drift_report.html
